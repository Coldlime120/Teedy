# GitHub Actions CI/CD Pipeline for Teedy Project
#
# 功能：
# - Maven 构建
# - PMD 代码检查
# - 运行测试并生成测试报告
# - 生成 JavaDoc 文档
# - 打包 JAR 文件

name: CI Pipeline

# 触发条件
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# 环境变量
env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: "-Xmx512m"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'  # 解决 Node.js 20 弃用警告

jobs:
  # 主构建任务
  build:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤1：检出代码
      - name: Checkout code
        uses: actions/checkout@v4
      
      # 步骤2：设置 JDK
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'
      
      # 步骤3：Maven 构建
      - name: Build with Maven
        run: |
          mvn clean compile -DskipTests
      
      # 步骤4：PMD 代码检查
      - name: Run PMD analysis
        run: |
          mvn pmd:pmd || true
        continue-on-error: true
      
      # 步骤5：运行测试
      - name: Run tests
        run: |
          mvn test
      
      # 步骤6：生成测试报告
      - name: Generate test reports
        run: |
          mvn surefire-report:report || true
        continue-on-error: true
      
      # 步骤7：生成 JavaDoc（关键修复！）
      - name: Generate JavaDoc
        run: |
          mvn javadoc:javadoc \
            -Dmaven.javadoc.failOnError=false \
            -Dmaven.javadoc.doclint=none \
            -Dmaven.javadoc.additionalparams="-Xdoclint:none" \
            -pl docs-core,docs-web-commons,docs-web || true
        continue-on-error: true
      
      # 步骤8：打包应用
      - name: Package application
        run: |
          mvn package -DskipTests
      
      # 步骤9：上传 JAR 文件
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: teedy-jar
          path: |
            **/target/*.jar
            **/docs-*/target/*.jar
          retention-days: 7
          if-no-files-found: warning
      
      # 步骤10：上传测试报告
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/*.xml
            **/docs-*/target/surefire-reports/*.xml
          retention-days: 7
          if-no-files-found: warning
      
      # 步骤11：上传 JavaDoc
      - name: Upload JavaDoc
        uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: |
            **/target/site/apidocs/
            **/docs-*/target/site/apidocs/
          retention-days: 7
          if-no-files-found: warning
      
      # 步骤12：上传 PMD 报告
      - name: Upload PMD report
        uses: actions/upload-artifact@v4
        with:
          name: pmd-report
          path: |
            **/target/site/pmd.html
            **/docs-*/target/site/pmd.html
          retention-days: 7
          if-no-files-found: warning
      
      # 步骤13：显示构建摘要
      - name: Build Summary
        run: |
          echo "## ✅ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Checkout | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| PMD Analysis | ⚠️ |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| JavaDoc | ⚠️ |" >> $GITHUB_STEP_SUMMARY
          echo "| Package | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note**: PMD and JavaDoc may have warnings due to JDK 21 strictness." >> $GITHUB_STEP_SUMMARY
